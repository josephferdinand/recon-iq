[install]
# Seven-day supply-chain guard: skip newly published package versions.
minimumReleaseAge = 604800
# Each entry bypasses the seven-day guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@meta.dev/vite-tanstack-config", "@meta.dev/mcp-js", "@meta.dev/vite-plugin-dev-server-bridge", "@meta.dev/vite-plugin-hmr-gate"]
