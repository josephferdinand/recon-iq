openapi: 3.1.0
info:
  title: ReconIQ API
  version: "1.0.0"
  summary: Source-backed ReconIQ HTTP route contract
  description: |
    This document describes HTTP handlers present in the ReconIQ repository. It is
    not deployment evidence and does not guarantee that a particular ReconIQ
    environment has the routes, schema migrations, token scopes, or provider
    configuration needed to serve them. See the API reference for availability
    boundaries and the current token-scope provisioning gap.

    The primary workspace API is `/api/v1/{tenantSlug}/...` and uses an opaque
    bearer token stored in `api_tokens`. The token's tenant must match the path
    tenant and its `scopes` must include each operation's `x-required-scope`.
    OAuth/MCP and SCIM use distinct authentication systems. App-internal server
    functions and service-only cron/worker routes are not part of this contract.
tags:
  - name: Platform
    description: Public specification/status and OAuth-related integration routes. General platform-administration REST is not exposed here.
  - name: Tenant
    description: Requests are tenant-bound by the opaque API token and tenantSlug path segment.
  - name: Workspace
    description: Reconciliation, breaks, connectors, watchers, Data Prep, reference data, reports, and workflow jobs.
  - name: Governance
    description: Separate maker/checker decisions and environment change-request lifecycle operations.
  - name: Identity
    description: SCIM and OAuth/MCP identity integration routes with their own credentials.
components:
  securitySchemes:
    tenantApiToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque API token
      description: Tenant-bound opaque bearer value from `api_tokens`; not a Supabase JWT or OAuth client-credentials sandbox JWT.
    aidpToken:
      type: apiKey
      in: header
      name: x-aidp-token
      description: The AIDP extraction route accepts this header or the tenant API bearer header.
    scimToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque SCIM token
      description: Dedicated token stored in `scim_tokens`; it is not a tenant API token.
    userSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed-in ReconIQ user session, used only by the MCP OAuth authorize step.
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema: { type: string }
      description: Must identify the same tenant to which the bearer API token is bound.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Bounded page size. This is not a general offset/cursor-paginated list contract.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Required by the specific mutation operations that reference this parameter. Reuse the same key only for a retry of the same logical request.
    BreakCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Timestamp from `next_cursor` on the prior breaks response; this route uses a timestamp cursor, not an opaque token.
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        required: { type: string }
        details: { type: object, additionalProperties: true }
        retry_after_seconds: { type: integer, minimum: 0 }
    JsonObject:
      type: object
      additionalProperties: true
    QueuedJob:
      type: object
      required: [api_version, job_id, status, idempotent_replay]
      properties:
        api_version: { type: string, const: "v1" }
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, dead] }
        idempotent_replay: { type: boolean }
    DataPrepPipelineInput:
      type: object
      required: [name, steps, dq_rules, on_failure, enabled]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
        source_data_source_id: { type: [string, "null"], format: uuid }
        output_data_source_id: { type: [string, "null"], format: uuid }
        steps: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/JsonObject" } }
        dq_rules: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/JsonObject" } }
        on_failure: { type: string, enum: [block, warn, drop_rows] }
        enabled: { type: boolean }
    DataPrepPipelinePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
        source_data_source_id: { type: [string, "null"], format: uuid }
        output_data_source_id: { type: [string, "null"], format: uuid }
        steps: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/JsonObject" } }
        dq_rules: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/JsonObject" } }
        on_failure: { type: string, enum: [block, warn, drop_rows] }
        enabled: { type: boolean }
    WatcherInput:
      type: object
      required: [data_source_id, name, watch_type]
      properties:
        data_source_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        watch_type: { type: string, description: One of the watcher types configured by the source engine. }
        config: { type: object, additionalProperties: true, default: {} }
        severity: { type: string, enum: [info, warning, critical], default: warning }
        enabled: { type: boolean, default: true }
    BreakAction:
      oneOf:
        - type: object
          required: [action, assignee]
          properties: { action: { const: assign }, assignee: { type: [string, "null"], format: uuid } }
        - type: object
          required: [action, root_cause]
          properties: { action: { const: classify }, root_cause: { type: string, minLength: 1, maxLength: 500 }, priority: { type: string, enum: [P1, P2, P3, P4] }, tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } } }
        - type: object
          required: [action, body]
          properties: { action: { const: comment }, body: { type: string, minLength: 1, maxLength: 4000 }, internal: { type: boolean, default: true } }
        - type: object
          required: [action, filename]
          properties: { action: { const: attach }, filename: { type: string, minLength: 1, maxLength: 255 }, mime_type: { type: string, maxLength: 100 }, size_bytes: { type: integer, minimum: 0, maximum: 25000000 } }
        - type: object
          required: [action, resolution_note]
          properties: { action: { const: resolve }, resolution_note: { type: string, minLength: 1, maxLength: 4000 }, root_cause: { type: string, minLength: 1, maxLength: 500 } }
        - type: object
          required: [action, reason, amount, currency, gl_account]
          properties: { action: { const: write_off }, reason: { type: string, minLength: 1, maxLength: 4000 }, amount: { type: number }, currency: { type: string, pattern: "^[A-Z]{3}$" }, gl_account: { type: string, minLength: 1, maxLength: 100 } }
        - type: object
          required: [action, request_id, decision]
          properties: { action: { const: approve_write_off }, request_id: { type: string, format: uuid }, decision: { type: string, enum: [approved, rejected] }, decision_note: { type: string, maxLength: 2000 } }
        - type: object
          required: [action, reason]
          properties: { action: { const: reopen }, reason: { type: string, minLength: 1, maxLength: 4000 } }
        - type: object
          required: [action]
          properties: { action: { const: reprocess } }
      discriminator: { propertyName: action }
    ConnectorAgentLease:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$" }
        lease_seconds: { type: integer, minimum: 30, maximum: 300, default: 120 }
    ConnectorAgentResult:
      type: object
      required: [agent_id, rows, columns, filename]
      properties:
        agent_id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$" }
        rows: { type: array, maxItems: 50000, items: { $ref: "#/components/schemas/JsonObject" } }
        columns: { type: array, maxItems: 500, items: { type: string, minLength: 1, maxLength: 200 } }
        filename: { type: string, minLength: 1, maxLength: 255 }
      x-max-request-bytes: 10485760
    ConnectorAgentFailure:
      type: object
      required: [agent_id, error_code]
      properties:
        agent_id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$" }
        error_code: { type: string, pattern: "^connector_agent_[a-z0-9_]{1,80}$" }
    EnvironmentChangeCreate:
      type: object
      additionalProperties: false
      required: [direction, source_tenant_id, target_tenant_id, title, reason]
      properties:
        direction: { type: string, enum: [dev_to_prod, prod_to_dev] }
        source_tenant_id: { type: string, format: uuid }
        target_tenant_id: { type: string, format: uuid }
        title: { type: string, minLength: 3, maxLength: 120 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    EnvironmentChangeDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        comment: { type: [string, "null"], maxLength: 500 }
        confirm_access_mapping: { type: boolean }
    ReferenceDataStage:
      type: object
      required: [rows, effective_from, change_note]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/JsonObject" }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
        change_note: { type: string, minLength: 3, maxLength: 1000 }
    ReferenceDataDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        reason: { type: [string, "null"], maxLength: 1000 }
      description: Server trims reason before validation; rejecting a version requires at least three trimmed characters.
      if:
        properties: { approve: { const: false } }
        required: [approve]
      then:
        required: [reason]
        properties:
          reason: { type: string, minLength: 3, pattern: '\S[\s\S]+\S' }
    ReportRunInput:
      type: object
      properties:
        days: { type: integer, minimum: 7, maximum: 180, default: 30 }
        lifecycle:
          type: array
          maxItems: 6
          items: { type: string, enum: [new, assigned, investigating, pending_counterparty, resolved, written_off] }
        priority:
          type: array
          maxItems: 4
          items: { type: string, enum: [P1, P2, P3, P4] }
    AidpExtractRequest:
      type: object
      required: [document_type_code, file_url]
      properties:
        document_type_code: { type: string, minLength: 1 }
        file_url: { type: string, format: uri, description: HTTPS URL on a configured AIDP host allow-list. }
        callback_url: { type: [string, "null"], format: uri, description: Optional HTTPS callback; outbound URL safety checks apply. }
      x-max-downloaded-file-bytes: 52428800
    AiInferenceRequest:
      type: object
      properties:
        tenant_id: { type: string, format: uuid, description: Required when using a user JWT; token auth derives tenant from the API token. }
        request_class: { type: string, default: chat }
        model: { type: string }
        messages: { type: array, items: { $ref: "#/components/schemas/JsonObject" } }
        max_tokens: { type: integer, minimum: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas: { type: array, items: { type: string } }
        status: { type: string }
        scimType: { type: string }
        detail: { type: string }
    GenericSuccess:
      type: object
      additionalProperties: true
      description: Endpoint-specific JSON response. Consult the ReconIQ API Reference page for this operation.
    ReconReadError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ReconReadRun:
      type: object
      required:
        - id
        - run_uid
        - definition_id
        - status
        - matched_count
        - exception_count
        - total_rows
        - started_at
        - completed_at
        - matched_input_memberships
      properties:
        id:
          type: string
          format: uuid
        run_uid:
          type:
            - string
            - 'null'
        definition_id:
          type: string
          format: uuid
        status:
          type: string
        matched_count:
          type:
            - number
            - 'null'
        exception_count:
          type:
            - number
            - 'null'
        total_rows:
          type:
            - number
            - 'null'
        started_at:
          type: string
        completed_at:
          type:
            - string
            - 'null'
        matched_input_memberships:
          type:
            - number
            - 'null'
    ReconReadHistory:
      type: object
      required:
        - api_version
        - rows
        - total
        - page
        - page_size
        - has_next
        - audit_id
      properties:
        api_version:
          const: v1
        rows:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ReconReadRun'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          const: 50
        has_next:
          type: boolean
        audit_id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
    ReconReadResults:
      type: object
      required:
        - api_version
        - run
        - results
        - field_names
        - parent_count
        - page
        - page_size
        - has_next
        - status_counts
        - audit_id
      properties:
        api_version:
          const: v1
        run:
          $ref: '#/components/schemas/ReconReadRun'
        results:
          type: array
          maxItems: 50
          items: {}
        field_names:
          type:
            - array
            - 'null'
          items: {}
        parent_count:
          type:
            - integer
            - 'null'
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          const: 50
        has_next:
          type: boolean
        status_counts:
          type:
            - object
            - 'null'
          required:
            - match_groups
            - exception_items
            - exception_buckets
          properties:
            match_groups:
              type:
                - number
                - 'null'
              minimum: 0
            exception_items:
              type:
                - number
                - 'null'
              minimum: 0
            exception_buckets:
              type:
                - object
                - 'null'
              additionalProperties:
                type: number
                minimum: 0
        audit_id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
paths:
  /api/public/openapi.yaml:
    get:
      tags: [Platform]
      operationId: getSourceOpenApiYaml
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/openapi[.]yaml.ts"
      x-source-line: 8
      x-source-error-literals: []
      summary: Read the OpenAPI YAML from this application build
      description: The handler returns the repository OpenAPI file. A successful source build does not prove hosted endpoint availability or deployment parity.
      responses:
        "200":
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /api/public/status.json:
    get:
      tags: [Platform]
      operationId: getPublicStatus
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/status[.]json.ts"
      x-source-line: 19
      x-source-error-literals: []
      summary: Read the public system status snapshot
      responses:
        "200": { description: Snapshot available, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
        "503": { description: Status snapshot reports an unavailable data dependency, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
  /api/public/tokens/introspect:
    post:
      tags: [Platform, Tenant]
      operationId: introspectTenantApiToken
      x-source-handler: "introspectWorkflowToken"
      x-source-file: "src/lib/public-workflow-api.server.ts"
      x-source-line: 105
      x-source-error-literals: ["authentication_unavailable","invalid_token","missing_bearer","missing_scope","rate_limit_exceeded","rate_limit_unavailable","tenant_lookup_unavailable","token_expired","unaccountable_token"]
      summary: Validate the bearer token on the request
      description: Returns active status, tenant slug, actor subject, scope list, and expiry for the same bearer token. Limited to 120 requests per token per 60-second window.
      security: [{ tenantApiToken: [] }]
      responses:
        "200": { description: Token is active, content: { application/json: { schema: { type: object, required: [active, tenant_slug, subject, scopes], properties: { active: { type: boolean }, tenant_slug: { type: string }, subject: { type: string }, scopes: { type: array, items: { type: string } }, expires_at: { type: [string, "null"], format: date-time } } } } } }
        "401": { description: Missing, invalid, revoked, or expired token, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: Rate limit exceeded; response includes `Retry-After` and `retry_after_seconds`. }
        "503": { description: Authentication, rate limit, or tenant lookup unavailable. }
  /api/public/regulatory/packs:
    get:
      tags: [Platform]
      operationId: listPublishedRegulatoryPacks
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/regulatory/packs.ts"
      x-source-line: 21
      x-source-error-literals: []
      summary: List public metadata for published regulatory packs
      description: Anonymous read of published catalogue metadata only; install counts and field-dictionary internals are not returned.
      responses: { "200": { description: Published regulatory pack metadata; body contains a packs array. }, "503": { description: Catalogue lookup unavailable. } }
  /api/public/ai/inference:
    post:
      tags: [Workspace]
      operationId: proxyAiInference
      x-source-handler: "POST inline handler"
      x-source-file: "src/routes/api/public/ai/inference.ts"
      x-source-line: 42
      x-source-error-literals: ["api-token auth disabled","invalid json","invalid jwt","missing bearer","provider endpoint not configured","server misconfigured","token expired","token lacks ai.inference scope","token revoked","unknown token"]
      summary: Proxy an AI inference request through configured routes
      description: Source accepts either a Supabase user JWT (user/tenant access remains RLS-scoped) or an API token with the `ai.inference` scope. The API-token tenant is derived from the token. Provider/model availability and upstream response bodies vary by runtime configuration.
      security:
        - tenantApiToken: []
        - userSession: []
      x-required-scope: ai.inference
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiInferenceRequest" } } } }
      responses: { "200": { description: Upstream model response. }, "401": { description: Missing or invalid bearer. }, "403": { description: API token lacks ai.inference or user access is denied. }, "424": { description: Provider endpoint is not configured. }, default: { description: Route, provider, or upstream failure; see current source for response behavior. } }
  /api/public/aidp/extract:
    post:
      tags: [Workspace]
      operationId: queueAidpExtraction
      x-source-handler: "POST inline handler"
      x-source-file: "src/routes/api/public/aidp/extract.ts"
      x-source-line: 71
      x-source-error-literals: ["callback_url_must_be_https","dead","failed","file_fetch_failed","file_host_not_allowed","file_too_large","file_url_must_be_https","idempotency_key_too_long","internal_processing_error","invalid_callback_url","invalid_file_url","invalid_json","invalid_token","missing_bearer","missing_document_type_code","missing_file_url","missing_scope","path_traversal","quota_exceeded","token_expired","token_revoked","unknown_document_type_code","unsupported_content_type"]
      summary: Fetch an approved document URL and queue AIDP extraction
      description: Accepts the token in `x-aidp-token` or Authorization bearer, requires `aidp:extract`, downloads only allow-listed HTTPS PDF/PNG/JPEG sources up to 50 MiB, and returns a queued job. Optional idempotency key (maximum 200 characters) is source-supported; it is not required.
      security:
        - aidpToken: []
        - tenantApiToken: []
      x-required-scope: aidp:extract
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AidpExtractRequest" } } } }
      responses: { "202": { description: Job queued; includes job_id, document_id, status and Location. }, "200": { description: Idempotent replay returned a completed extraction response. }, "400": { description: Invalid body, URL, host, MIME type, or document type. }, "401": { description: Token is missing, invalid, revoked, or expired. }, "413": { description: File is larger than 50 MiB. }, "429": { description: Tenant AIDP quota exceeded. }, "501": { description: API-token auth is disabled in this runtime. }, "503": { description: Required queue/storage/service unavailable. } }
  /api/public/aidp/jobs/{jobId}:
    get:
      tags: [Workspace]
      operationId: getAidpExtractionJob
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/aidp/jobs.$jobId.ts"
      x-source-line: 12
      x-source-error-literals: ["invalid_token","job_lookup_failed","job_not_found","missing_bearer","missing_scope","processing_failed","token_expired"]
      summary: Poll an AIDP extraction job
      description: >-
        Requires the same token tenant and `aidp:extract`. While queued/running,
        the source returns HTTP 200 plus `Retry-After: 2`; a successful job
        returns its stored extraction response.
      security:
        - aidpToken: []
        - tenantApiToken: []
      x-required-scope: aidp:extract
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Job status or completed extraction result. }, "401": { description: Token invalid or expired. }, "403": { description: Token lacks aidp:extract. }, "404": { description: Job not found in token tenant. }, "500": { description: Job lookup failed. } }
  /api/public/oauth/register:
    get:
      tags: [Platform, Identity]
      operationId: readOAuthClientMetadata
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/oauth/register.ts"
      x-source-line: 16
      x-source-error-literals: []
      summary: Read registered OAuth client metadata for a redirect URI
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        "200": { description: Registered client name and allowed scopes. }
        "400": { description: Client or redirect URI is invalid. }
    post:
      tags: [Platform, Identity]
      operationId: registerMcpOAuthClient
      x-source-handler: "POST inline handler"
      x-source-file: "src/routes/api/public/oauth/register.ts"
      x-source-line: 32
      x-source-error-literals: ["rate_limit_exceeded"]
      summary: Register an OAuth authorization-code client
      description: This MCP OAuth registration route is separate from tenant API token issuance. HTTPS or loopback redirect URIs only; only authorization_code and refresh_token grant types are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [client_name, redirect_uris], properties: { client_name: { type: string, minLength: 1, maxLength: 120 }, redirect_uris: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uri } }, scope: { type: string }, grant_types: { type: array, items: { type: string } }, response_types: { type: array, items: { type: string } }, token_endpoint_auth_method: { type: string, enum: [none] } } }
      responses:
        "201": { description: Client registered with an issued `client_id`. }
        "400": { description: Client metadata, redirect URI, grant type, or scope rejected. }
        "429": { description: Registration rate limit exceeded; response includes `Retry-After`. }
        "503": { description: Client registration unavailable. }
  /api/public/oauth/mcp-authorize:
    get:
      tags: [Identity]
      operationId: listMcpAuthorizationMemberships
      x-source-handler: "GET inline handler"
      x-source-file: "src/routes/api/public/oauth/mcp-authorize.ts"
      x-source-line: 19
      x-source-error-literals: []
      summary: List active tenant memberships for the signed-in user
      security: [{ userSession: [] }]
      responses:
        "200": { description: Active memberships visible to this signed-in user. }
        "401": { description: ReconIQ user session required or invalid. }
        "503": { description: Membership lookup unavailable. }
    post:
      tags: [Identity]
      operationId: authorizeMcpOAuthClient
      x-source-handler: "POST inline handler"
      x-source-file: "src/routes/api/public/oauth/mcp-authorize.ts"
      x-source-line: 31
      x-source-error-literals: []
      summary: Authorize an OAuth client for one tenant and selected scopes
      security: [{ userSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
