<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ReconIQ monogram">
  <!-- Background seal: deep brand blue -->
  <rect x="0" y="0" width="100" height="100" rx="6" fill="#1e3a5f"/>
  <!-- Subtle inner sheen (top-down white fade) -->
  <rect x="0" y="0" width="100" height="50" rx="6" fill="url(#fv-sheen)" opacity="0.18"/>
  <!-- Inset accent border: brand cyan -->
  <rect x="5" y="5" width="90" height="90" rx="3.5" fill="none" stroke="#00d4ff" stroke-width="1.4"/>
  <!-- RQ ligature in Inter Bold, cream color -->
  <text x="50" y="54" text-anchor="middle" dominant-baseline="central"
        fill="#f4ede0"
        font-family="Inter, 'Space Grotesk', ui-sans-serif, system-ui, sans-serif"
        font-weight="700" font-size="50" letter-spacing="-1.5">RQ</text>
  <defs>
    <linearGradient id="fv-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>